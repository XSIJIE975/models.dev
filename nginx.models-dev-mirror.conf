# Replace both `/models-dev-mirror` occurrences with your deployment subpath.
# Replace `http://127.0.0.1:3066` with your upstream app address.

location = /models-dev-mirror {
  return 302 /models-dev-mirror/;
}

location /models-dev-mirror/ {
  proxy_pass http://127.0.0.1:3066;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
